spring.application.name=supplychain

# Database connection settings (Configured for standard local MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/networkiq?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Fallback Configuration: If MySQL is not running and H2 is preferred, uncomment the lines below:
# spring.datasource.url=jdbc:h2:mem:networkiq;DB_CLOSE_DELAY=-1;MODE=MySQL
# spring.datasource.username=sa
# spring.datasource.password=
# spring.datasource.driver-class-name=org.h2.Driver
# spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# SQL Initialization Settings (Runs schema.sql and data.sql to pre-populate)
spring.sql.init.mode=always
spring.sql.init.show-sql=true

# AI Engine FastAPI Base URL Connection
ai.engine.url=http://127.0.0.1:8000

# Enable H2 database console for debugging
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Port Configuration
server.port=8080
